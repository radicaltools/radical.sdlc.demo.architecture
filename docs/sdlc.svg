hanges the model</text><text class="tag" x="210.0" y="160.0">of the whole system</text><text class="tag" x="210.0" y="174.0">one pull request</text><rect class="box box-gate" x="312.0" y="125.0" width="152" height="62" rx="4"/><text class="title" x="388.0" y="146.0">Gate</text><text class="tag" x="388.0" y="160.0">radical check</text><text class="tag" x="388.0" y="174.0">the whole model</text><rect class="box box-auto" x="490.0" y="229.0" width="152" height="62" rx="4"/><text class="title" x="566.0" y="250.0">What is left?</text><text class="tag" x="566.0" y="264.0">radical diff</text><text class="tag" x="566.0" y="278.0">per repository</text><rect class="box box-auto" x="846.0" y="229.0" width="152" height="62" rx="4"/><text class="title" x="922.0" y="250.0">What is left?</text><text class="tag" x="922.0" y="264.0">radical diff</text><text class="tag" x="922.0" y="278.0">per repository</text><rect class="box box-auto" x="1202.0" y="229.0" width="152" height="62" rx="4"/><text class="title" x="1278.0" y="257.0">Nothing left</text><text class="tag" x="1278.0" y="271.0">closes the ticket</text><rect class="box box-agent" x="490.0" y="333.0" width="152" height="62" rx="4"/><text class="title" x="566.0" y="354.0">Coding agent</text><text class="tag" x="566.0" y="368.0">get_changes</text><text class="tag" x="566.0" y="382.0">builds its part</text><rect class="box box-gate" x="668.0" y="333.0" width="152" height="62" rx="4"/><text class="title" x="744.0" y="347.0">Gate</text><text class="tag" x="744.0" y="361.0">tests, sensors</text><text class="tag" x="744.0" y="375.0">radical check</text><text class="tag" x="744.0" y="389.0">its part</text><rect class="box box-agent" x="846.0" y="437.0" width="152" height="62" rx="4"/><text class="title" x="922.0" y="458.0">Coding agent</text><text class="tag" x="922.0" y="472.0">get_changes</text><text class="tag" x="922.0" y="486.0">builds its part</text><rect class="box box-gate" x="1024.0" y="437.0" width="152" height="62" rx="4"/><text class="title" x="1100.0" y="451.0">Gate</text><text class="tag" x="1100.0" y="465.0">tests, sensors</text><text class="tag" x="1100.0" y="479.0">radical check</text><text class="tag" x="1100.0" y="493.0">its part</text><path class="flow " d="M176.0 83.0 V124.0" marker-end="url(#a)"/><path class="flow ask" d="M244.0 125.0 V84.0" marker-end="url(#a-ask)"/><text class="note ask" x="250.0" y="107" text-anchor="start">a question</text><path class="flow " d="M286.0 156.0 H311.0" marker-end="url(#a)"/><path class="flow " d="M464.0 156.0 H542.0 V84.0" marker-end="url(#a)"/><text class="note " x="470.0" y="150.0" text-anchor="start">green</text><path class="flow " d="M590.0 83.0 V228.0" marker-end="url(#a)"/><path class="flow " d="M566.0 291.0 V332.0" marker-end="url(#a)"/><text class="note " x="572.0" y="306.0" text-anchor="start">starts it</text><path class="flow " d="M642.0 364.0 H667.0" marker-end="url(#a)"/><path class="flow " d="M820.0 364.0 H833.0 V52.0 H845.0" marker-end="url(#a)"/><text class="note " x="839.0" y="368.0" text-anchor="start">green</text><text class="note bad" x="566.0" y="410.0" text-anchor="middle">built nothing: ticket agent:stuck</text><text class="note ask" x="662.0" y="410.0" text-anchor="start">a question: a draft pull request</text><path class="flow " d="M922.0 83.0 V228.0" marker-end="url(#a)"/><path class="flow " d="M922.0 291.0 V436.0" marker-end="url(#a)"/><text class="note " x="928.0" y="306.0" text-anchor="start">starts the next: it calls the Warehouse</text><text class="note " x="622.0" y="472.0" text-anchor="start">waits while the Warehouse has work</text><path class="flow " d="M998.0 468.0 H1023.0" marker-end="url(#a)"/><path class="flow " d="M1176.0 468.0 H1189.0 V52.0 H1201.0" marker-end="url(#a)"/><text class="note " x="1195.0" y="472.0" text-anchor="start">green</text><path class="flow " d="M1278.0 83.0 V228.0" marker-end="url(#a)"/></svg>
