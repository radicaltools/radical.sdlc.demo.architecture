<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1730 520" role="img" aria-label="A person opens a ticket. The model agent models the change of the whole system on a branch, says on the ticket what it understood, and a review agent reads the change against the ticket. After a green Gate the system loop starts the Warehouse first, because the Shop calls it, then the Shop, each building on the same branch. A coding agent&#x27;s question goes to the model agent, who answers in the model, and the loop builds again. When every Gate is green, the evidence goes on the ticket, a person accepts it all at once, and the loop merges the model first, then the code."><style>
:root { --bg:#f4f6f9; --ink:#17202c; --muted:#566273; --rule:#d9dfe7; --arrow:#3d4a5c;
  --person:#fbefc9; --person-line:#a97a12; --agent:#e7e2fb; --agent-line:#5b47c4; --auto:#d9f0ea; --auto-line:#1b7f6b;
  --gate:#17202c; --gate-ink:#f4f6f9; --bad:#c2352c; --ask:#a97a12;
  --lane-person:#fbf6e6; --lane-agent:#f4f2fc; --lane-auto:#eaf6f3;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
@media (prefers-color-scheme: dark) { :root { --bg:#10151c; --ink:#e7ecf3; --muted:#9aa6b6; --rule:#28313d; --arrow:#aab5c4;
  --person:#3a2f12; --person-line:#d9a93a; --agent:#2a2452; --agent-line:#a494f2; --auto:#123a33; --auto-line:#4fc4a9;
  --gate:#e7ecf3; --gate-ink:#10151c; --bad:#f0746a; --ask:#d9a93a;
  --lane-person:#1a1810; --lane-agent:#17162a; --lane-auto:#101f1c } }
.lane-person { fill:var(--lane-person) } .lane-agent { fill:var(--lane-agent) } .lane-auto { fill:var(--lane-auto) }
.rule { stroke:var(--rule) }
.lane-name { font:600 12px var(--sans); fill:var(--muted) }
.box { stroke-width:1.2 }
.box-person { fill:var(--person); stroke:var(--person-line) }
.box-agent { fill:var(--agent); stroke:var(--agent-line) }
.box-auto { fill:var(--auto); stroke:var(--auto-line) }
.box-gate { fill:var(--gate); stroke:var(--gate) }
.title { font:600 12px var(--sans); fill:var(--ink); text-anchor:middle }
.tag { font:400 10px var(--mono); fill:var(--muted); text-anchor:middle }
.box-gate + .title, .box-gate + .title + .tag, .box-gate + .title + .tag + .tag, .box-gate + .title + .tag + .tag + .tag { fill:var(--gate-ink) }
.flow { fill:none; stroke:var(--arrow); stroke-width:1.4 }
.flow.bad { stroke:var(--bad) } .flow.ask { stroke:var(--ask); stroke-dasharray:4 3 }
.head { fill:var(--arrow) } .head-bad { fill:var(--bad) } .head-ask { fill:var(--ask) }
.note { font:400 11px var(--sans); fill:var(--muted) } .note.bad { fill:var(--bad) } .note.ask { fill:var(--ask) }
</style><defs>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 8 4 0 8z"/></marker>
<marker id="a-bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-bad" d="M0 0 8 4 0 8z"/></marker>
<marker id="a-ask" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-ask" d="M0 0 8 4 0 8z"/></marker>
</defs><rect class="lane lane-person" x="0" y="0" width="1730" height="104"/><text class="lane-name" x="14" y="56.0">Person</text><rect class="lane lane-agent" x="0" y="104" width="1730" height="104"/><line class="rule" x1="0" y1="104" x2="1730" y2="104"/><text class="lane-name" x="14" y="152.0">Model agent</text><text class="note" x="14" y="167.0" style="font-size:10px">architecture repository</text><rect class="lane lane-auto" x="0" y="208" width="1730" height="104"/><line class="rule" x1="0" y1="208" x2="1730" y2="208"/><text class="lane-name" x="14" y="256.0">System loop</text><text class="note" x="14" y="271.0" style="font-size:10px">architecture repository</text><rect class="lane lane-agent" x="0" y="312" width="1730" height="104"/><line class="rule" x1="0" y1="312" x2="1730" y2="312"/><text class="lane-name" x="14" y="360.0">Warehouse</text><text class="note" x="14" y="375.0" style="font-size:10px">its repository</text><rect class="lane lane-agent" x="0" y="416" width="1730" height="104"/><line class="rule" x1="0" y1="416" x2="1730" y2="416"/><text class="lane-name" x="14" y="464.0">Shop</text><text class="note" x="14" y="479.0" style="font-size:10px">its repository</text><rect class="box box-person" x="134.0" y="21.0" width="152" height="62" rx="4"/><text class="title" x="210.0" y="49.0">Opens a ticket</text><text class="tag" x="210.0" y="63.0">agent:implement</text><rect class="box box-person" x="1380.0" y="21.0" width="152" height="62" rx="4"/><text class="title" x="1456.0" y="49.0">Accepts it all</text><text class="tag" x="1456.0" y="63.0">agent:accept</text><rect class="box box-agent" x="134.0" y="125.0" width="152" height="62" rx="4"/><text class="title" x="210.0" y="146.0">Models the change</text><text class="tag" x="210.0" y="160.0">of the whole system</text><text class="tag" x="210.0" y="174.0">on change/&lt;n&gt;</text><rect class="box box-agent" x="312.0" y="125.0" width="152" height="62" rx="4"/><text class="title" x="388.0" y="146.0">Review agent</text><text class="tag" x="388.0" y="160.0">reads it against</text><text class="tag" x="388.0" y="174.0">the ticket</text><rect class="box box-gate" x="490.0" y="125.0" width="152" height="62" rx="4"/><text class="title" x="566.0" y="146.0">Gate</text><text class="tag" x="566.0" y="160.0">radical check</text><text class="tag" x="566.0" y="174.0">the whole model</text><rect class="box box-auto" x="668.0" y="229.0" width="152" height="62" rx="4"/><text class="title" x="744.0" y="250.0">What is left?</text><text class="tag" x="744.0" y="264.0">on change/&lt;n&gt;</text><text class="tag" x="744.0" y="278.0">per repository</text><rect class="box box-auto" x="1024.0" y="229.0" width="152" height="62" rx="4"/><text class="title" x="1100.0" y="250.0">What is left?</text><text class="tag" x="1100.0" y="264.0">on change/&lt;n&gt;</text><text class="tag" x="1100.0" y="278.0">per repository</text><rect class="box box-auto" x="1380.0" y="229.0" width="152" height="62" rx="4"/><text class="title" x="1456.0" y="250.0">All green</text><text class="tag" x="1456.0" y="264.0">the evidence</text><text class="tag" x="1456.0" y="278.0">on the ticket</text><rect class="box box-auto" x="1558.0" y="229.0" width="152" height="62" rx="4"/><text class="title" x="1634.0" y="250.0">Merges it all</text><text class="tag" x="1634.0" y="264.0">the model first</text><text class="tag" x="1634.0" y="278.0">then the code</text><rect class="box box-agent" x="668.0" y="333.0" width="152" height="62" rx="4"/><text class="title" x="744.0" y="354.0">Coding agent</text><text class="tag" x="744.0" y="368.0">get_changes</text><text class="tag" x="744.0" y="382.0">builds on change/&lt;n&gt;</text><rect class="box box-gate" x="846.0" y="333.0" width="152" height="62" rx="4"/><text class="title" x="922.0" y="354.0">Gate</text><text class="tag" x="922.0" y="368.0">tests, crosses</text><text class="tag" x="922.0" y="382.0">proof of the tests</text><rect class="box box-agent" x="1024.0" y="437.0" width="152" height="62" rx="4"/><text class="title" x="1100.0" y="458.0">Coding agent</text><text class="tag" x="1100.0" y="472.0">get_changes</text><text class="tag" x="1100.0" y="486.0">builds on change/&lt;n&gt;</text><rect class="box box-gate" x="1202.0" y="437.0" width="152" height="62" rx="4"/><text class="title" x="1278.0" y="458.0">Gate</text><text class="tag" x="1278.0" y="472.0">tests, crosses</text><text class="tag" x="1278.0" y="486.0">proof of the tests</text><path class="flow " d="M170.0 83.0 V124.0" marker-end="url(#a)"/><path class="flow ask" d="M222.0 125.0 V84.0" marker-end="url(#a-ask)"/><text class="note ask" x="296.0" y="42.0" text-anchor="start">from the model agent:</text><text class="note ask" x="296.0" y="55.0" text-anchor="start">what it understood (nobody waits),</text><text class="note ask" x="296.0" y="68.0" text-anchor="start">or a question only a person answers</text><path class="flow " d="M286.0 156.0 H311.0" marker-end="url(#a)"/><path class="flow ask" d="M388.0 187.0 V199.0 H250.0 V188.0" marker-end="url(#a-ask)"/><text class="note ask" x="394.0" y="198.0" text-anchor="start">problems: fixed once</text><path class="flow " d="M464.0 156.0 H489.0" marker-end="url(#a)"/><path class="flow " d="M642.0 156.0 H744.0 V228.0" marker-end="url(#a)"/><text class="note " x="648.0" y="150.0" text-anchor="start">green</text><path class="flow " d="M744.0 291.0 V332.0" marker-end="url(#a)"/><text class="note " x="738.0" y="306.0" text-anchor="end">starts it first: the Shop calls it</text><path class="flow " d="M820.0 364.0 H845.0" marker-end="url(#a)"/><text class="note bad" x="744.0" y="410.0" text-anchor="middle">could not: a person reads why</text><path class="flow " d="M922.0 333.0 V260.0 H1023.0" marker-end="url(#a)"/><text class="note " x="928.0" y="327.0" text-anchor="start">green</text><path class="flow " d="M1100.0 291.0 V436.0" marker-end="url(#a)"/><path class="flow " d="M1176.0 468.0 H1201.0" marker-end="url(#a)"/><path class="flow " d="M1278.0 437.0 V260.0 H1379.0" marker-end="url(#a)"/><text class="note " x="1284.0" y="431.0" text-anchor="start">green</text><path class="flow ask" d="M820.0 346.0 H833.0 V115 H266.0 V124.0" marker-end="url(#a-ask)"/><path class="flow ask" d="M1176.0 450.0 H1189.0 V115 H833.0" marker-end="url(#a-ask)"/><text class="note ask" x="844.0" y="129" text-anchor="start">a coding agent&#x27;s question: the model agent</text><text class="note ask" x="844.0" y="142" text-anchor="start">answers in the model, and the loop builds again</text><path class="flow " d="M1456.0 229.0 V84.0" marker-end="url(#a)"/><text class="note " x="1462.0" y="98.0" text-anchor="start">ready to accept</text><path class="flow " d="M1532.0 52.0 H1634.0 V228.0" marker-end="url(#a)"/><text class="note ask" x="1456.0" y="13.0" text-anchor="middle">a comment sends it back</text><text class="note " x="1634.0" y="306.0" text-anchor="middle">then the next in the queue</text></svg>
