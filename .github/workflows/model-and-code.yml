name: Model agent

# A ticket here, labelled agent:implement, becomes one pull request of the model of the whole system.
# The standards' workflow does it. It stays a model alone because .radical/reconciled.json exists: the
# code follows, in each repository, from system.yml.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

concurrency:
  group: model-agent-${{ github.event.issue.number }}

permissions:
  contents: read
  issues: write

jobs:
  agents:
    uses: radicaltools/radical.tools.sdlc.demo.2.standards/.github/workflows/model-and-code.yml@v2.3.0
    secrets: inherit
